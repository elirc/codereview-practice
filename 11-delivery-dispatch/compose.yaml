name: delivery-dispatch

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5463:5432"
    volumes:
      - ./deploy/initdb/20-databases.sql:/docker-entrypoint-initdb.d/20-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "6393:4222"
      - "6394:8222"
    volumes:
      - natsdata:/data

volumes:
  pgdata:
  natsdata:
