services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: issues
      POSTGRES_PASSWORD: issues
      POSTGRES_DB: issues
    ports:
      - "5453:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issues -d issues"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
