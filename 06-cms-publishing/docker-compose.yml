services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "5456:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cms-minio
      MINIO_ROOT_PASSWORD: cms-minio-secret
    ports:
      - "9006:9000"
      - "9007:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 cms-minio cms-minio-secret; do sleep 1; done;
      mc mb --ignore-existing local/cms-media;
      mc anonymous set none local/cms-media;
      "

volumes:
  pgdata:
  miniodata:
