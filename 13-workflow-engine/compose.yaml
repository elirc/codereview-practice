services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wfe
      POSTGRES_PASSWORD: wfe
      POSTGRES_DB: wfe
    ports:
      - "5465:5432"
    volumes:
      - wfe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfe -d wfe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wfe-pgdata:
