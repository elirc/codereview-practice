name: 02-expense-tracker

on:
  push:
    paths: ["02-expense-tracker/**", ".github/workflows/02-expense-tracker.yml"]
  pull_request:
    paths: ["02-expense-tracker/**", ".github/workflows/02-expense-tracker.yml"]

defaults:
  run:
    working-directory: 02-expense-tracker

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense -d expense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://expense:expense@localhost:5432/expense_test
      TEST_DATABASE_URL: postgresql+psycopg://expense:expense@localhost:5432/expense_test
      BASE_CURRENCY: USD
      RECEIPT_STORAGE_DIR: /tmp/expense-receipts
    defaults:
      run:
        working-directory: 02-expense-tracker/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrate
        run: alembic upgrade head
      - name: Seed
        run: python -m app.seed
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-expense-tracker/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
