name: 07-rental-manager

on:
  push:
    paths: ["07-rental-manager/**", ".github/workflows/07-rental-manager.yml"]
  pull_request:
    paths: ["07-rental-manager/**", ".github/workflows/07-rental-manager.yml"]

defaults:
  run:
    working-directory: 07-rental-manager

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentmgr
          POSTGRES_PASSWORD: rentmgr
          POSTGRES_DB: rentmgr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentmgr -d rentmgr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rentmgr:rentmgr@localhost:5432/rentmgr_test?sslmode=disable
      TEST_DATABASE_URL: postgres://rentmgr:rentmgr@localhost:5432/rentmgr_test?sslmode=disable
      APP_ENV: test
      APP_TIMEZONE: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"

      - name: Resolve modules
        # go.sum is generated rather than committed.
        run: go mod tidy && go mod download

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Generated code is current
        run: sqlc diff

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...

      - name: Build
        run: go build ./...

      - name: Migrate
        run: go run ./cmd/rentmgr migrate up

      - name: Test
        # Integration tests share one database, so packages run one at a time.
        run: go test -p 1 -count=1 ./...
