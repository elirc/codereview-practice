name: 05-event-ticketing

on:
  push:
    paths: ["05-event-ticketing/**", ".github/workflows/05-event-ticketing.yml"]
  pull_request:
    paths: ["05-event-ticketing/**", ".github/workflows/05-event-ticketing.yml"]

defaults:
  run:
    working-directory: 05-event-ticketing

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"

      - name: Install gems
        run: bundle install --jobs 4

      - name: RuboCop
        run: bin/rubocop

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/event_ticketing_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"

      - name: Install gems
        run: bundle install --jobs 4

      - name: Check autoloading
        run: bin/rails zeitwerk:check

      - name: Create and migrate the database
        run: bin/rails db:create db:migrate

      - name: Run tests
        run: bin/rails test
