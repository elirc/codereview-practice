name: 10-collab-docs

on:
  push:
    paths: ["10-collab-docs/**", ".github/workflows/10-collab-docs.yml"]
  pull_request:
    paths: ["10-collab-docs/**", ".github/workflows/10-collab-docs.yml"]

defaults:
  run:
    working-directory: 10-collab-docs

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab_test
        ports:
          - 5462:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6391:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://collab:collab@localhost:5462/collab_test
      TEST_DATABASE_URL: postgres://collab:collab@localhost:5462/collab_test
      TEST_REDIS_URL: redis://localhost:6391
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Migrate
        run: |
          cp .env.example .env
          npm run migrate
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
