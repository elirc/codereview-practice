name: 04-shop-inventory

on:
  push:
    paths: ["04-shop-inventory/**", ".github/workflows/04-shop-inventory.yml"]
  pull_request:
    paths: ["04-shop-inventory/**", ".github/workflows/04-shop-inventory.yml"]

defaults:
  run:
    working-directory: 04-shop-inventory

env:
  DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
  DATABASE_URL: postgres://shop:shop@localhost:5432/shop
  CELERY_BROKER_URL: memory://
  PAYMENT_WEBHOOK_SECRET: whsec_ci_only_signing_secret

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "ruff==0.8.4"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04-shop-inventory/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check configuration
        run: python manage.py check
      - name: Migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Test
        run: pytest
