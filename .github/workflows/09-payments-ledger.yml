name: 09-payments-ledger

on:
  push:
    paths: ["09-payments-ledger/**", ".github/workflows/09-payments-ledger.yml"]
  pull_request:
    paths: ["09-payments-ledger/**", ".github/workflows/09-payments-ledger.yml"]

defaults:
  run:
    working-directory: 09-payments-ledger

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports:
          - 5461:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5461/ledger
      DATABASE_USER: ledger
      DATABASE_PASSWORD: ledger
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Lint and format check
        run: gradle ktlintCheck

      - name: Build
        run: gradle compileKotlin compileTestKotlin

      - name: Migrate
        run: gradle bootRun --args='--spring.profiles.active=migrate'

      - name: Seed
        run: gradle bootRun --args='--spring.profiles.active=seed'

      - name: Test
        run: gradle test
