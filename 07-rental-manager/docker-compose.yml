services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rentmgr
      POSTGRES_PASSWORD: rentmgr
      POSTGRES_DB: rentmgr
    ports:
      - "5457:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentmgr -d rentmgr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
