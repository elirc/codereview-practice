[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-inventory"
version = "1.0.0"
description = "Back office and order API for a small single-currency shop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.1.4",
    "djangorestframework==3.15.2",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis==5.2.1",
    "django-environ==0.11.2",
    "structlog==24.4.0",
    "django-structlog==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "factory-boy==3.3.1",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "catalog*", "inventory*", "orders*", "payments*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "catalog", "inventory", "orders", "payments", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
